<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoom web probe</title>
  <style>
    @font-face { font-family: "IBM Plex Sans Arabic"; src: url("/assets/assets/fonts/IBMPlexSansArabic-Regular.ttf"); }
    :root { --bg: #f5f6f2; --fg: #1b2420; --muted: #5a665f; --line: #d8ded9; --accent: #1f6b57; --tile: #e7ebe8; }
    @media (prefers-color-scheme: dark) { :root { --bg: #131816; --fg: #e3eae6; --muted: #98a59e; --line: #2c3632; --accent: #6cc3a6; --tile: #222a27; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.7 "IBM Plex Sans Arabic", Tahoma, sans-serif; }
    main { max-width: 900px; margin-inline: auto; padding: 16px; display: grid; gap: 14px; }
    form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
    input, select, button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); }
    button { background: var(--accent); color: var(--bg); border: 0; cursor: pointer; }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    #status { font-variant-numeric: tabular-nums; }
    video-player-container { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    video-player { width: 100%; aspect-ratio: 4 / 3; border-radius: 12px; background: var(--tile); overflow: hidden; }
    ol#trials { margin: 0; padding-inline-start: 22px; font-variant-numeric: tabular-nums; }
    ul#people { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 15px; }
    ul#people li { display: flex; gap: 4px; align-items: center; }
  </style>
</head>
<body>
<main>
  <h1 data-t="title"></h1>
  <p data-t="intro" style="margin:0;color:var(--muted)"></p>
  <form id="form">
    <label><span data-t="role"></span>
      <select id="role">
        <option value="student" data-t="roleStudent"></option>
        <option value="teacher" data-t="roleTeacher"></option>
      </select>
    </label>
    <label><span data-t="seat"></span><select id="seat"></select></label>
    <label><span data-t="room"></span><input id="room" value="spike-room" dir="ltr" pattern="[a-z0-9][a-z0-9-]{2,39}" autocapitalize="off" autocorrect="off" required></label>
    <label><span data-t="device"></span><input id="device" dir="ltr" pattern="[A-Za-z0-9-]{2,30}" autocapitalize="off" autocorrect="off" required></label>
    <label><span data-t="code"></span><input id="code" dir="ltr" autocapitalize="off" autocorrect="off" required></label>
  </form>
  <div class="row">
    <button id="join" data-t="join"></button>
    <button id="trials20" class="secondary" data-t="trials"></button>
    <button id="leave" class="secondary" data-t="leave" hidden></button>
  </div>
  <div class="row" id="call" hidden>
    <button class="secondary" id="mic" data-t="micOff"></button>
    <button id="unlockAudio" data-t="unlockAudio" hidden></button>
  </div>
  <div class="row" id="host" hidden>
    <button class="secondary" id="muteAll" data-t="muteAll"></button>
    <button class="secondary" id="record" data-t="recordStart"></button>
  </div>
  <p id="status" aria-live="polite"></p>
  <ul id="people" aria-live="polite"></ul>
  <video-player-container id="videos"></video-player-container>
  <ol id="trials"></ol>
</main>
<script src="/zoom-web/vendor/zoom-video-sdk.umd.js"></script>
<script src="/zoom-web/strings.js"></script>
<script src="/zoom-web/probe.js"></script>
</body>
</html>
